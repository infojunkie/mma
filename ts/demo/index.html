<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MMA — TypeScript demo</title>
    <!-- The library keeps spessasynth_core as an external import (good
         for npm consumers); a plain browser page resolves it here. -->
    <script type="importmap">
      {
        "imports": {
          "spessasynth_core": "https://cdn.jsdelivr.net/npm/spessasynth_core@4.3.22/+esm"
        }
      }
    </script>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }
      body {
        max-width: 60rem;
        margin: 2rem auto;
        padding: 0 1rem;
        line-height: 1.45;
      }
      h1 {
        font-size: 1.4rem;
      }
      textarea {
        width: 100%;
        min-height: 22rem;
        font-family: ui-monospace, monospace;
        font-size: 0.85rem;
        padding: 0.6rem;
        box-sizing: border-box;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        align-items: center;
        margin: 0.6rem 0;
      }
      button {
        padding: 0.4rem 0.9rem;
        cursor: pointer;
      }
      input[type='url'],
      input[type='text'] {
        flex: 1 1 18rem;
        padding: 0.35rem;
        font-family: ui-monospace, monospace;
        font-size: 0.8rem;
      }
      #status {
        font-size: 0.85rem;
        white-space: pre-wrap;
        font-family: ui-monospace, monospace;
        background: color-mix(in srgb, currentColor 8%, transparent);
        padding: 0.5rem 0.7rem;
        border-radius: 6px;
        min-height: 2.4rem;
      }
      .muted {
        opacity: 0.7;
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <h1>MMA — Musical MIDI Accompaniment, in the browser</h1>
    <p class="muted">
      The library (<code>../dist/index.js</code>) parses the MMA source below and produces a MIDI file;
      playback uses <a href="https://www.npmjs.com/package/spessasynth_lib">spessasynth_lib</a> loaded from a CDN.
    </p>

    <div class="row">
      <button id="play">▶ Play</button>
      <button id="stop" disabled>■ Stop</button>
      <button id="download">⬇ Download .mid</button>
      <button id="preset-blues">Preset: blues (self-contained)</button>
      <button id="preset-groove">Preset: groove from database</button>
    </div>

    <textarea id="source" spellcheck="false"></textarea>

    <div class="row">
      <input
        id="db-url"
        type="url"
        value="../assets/mma-grooves.db.gz"
        aria-label="Groove database URL"
      />
      <button id="load-db">Load groove database</button>
      <label class="muted">
        Add an .mma file:
        <input id="add-file" type="file" accept=".mma" />
      </label>
    </div>

    <div id="status">Ready. Press Play.</div>

    <script type="module" src="./demo.mjs"></script>
  </body>
</html>
